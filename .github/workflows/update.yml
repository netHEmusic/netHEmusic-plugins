name: update

# 每天自动重建插件市场清单：扫描所有带 nethe-plugin 话题的仓库，聚合成 plugins.json。
# 也可以在 Actions 页手动跑（update → Run workflow）。

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 聚合插件清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/market/build.mjs

      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          if git diff --staged --quiet; then
            echo "清单没有变化，不提交"
          else
            git commit -m "chore: 自动更新插件清单"
            git push
          fi
